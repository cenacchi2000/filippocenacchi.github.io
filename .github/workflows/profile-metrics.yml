name: Refresh profile metrics
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read profile counts
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python -m pip install beautifulsoup4
          python scripts/profile_metrics.py
      - name: Save verified changes
        run: |
          git add profile-metrics.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public profile counts'
            git push
          fi
