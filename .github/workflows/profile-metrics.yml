name: Refresh profile metrics
on:
  schedule:
    - cron: '15 22 * * *'
  push:
    paths:
      - 'scripts/profile_metrics.py'
      - 'scripts/test_profile_metrics.py'
      - '.github/workflows/profile-metrics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser and check extraction
        run: |
          python -m pip install beautifulsoup4==4.15.0
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Read profile counts
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python scripts/profile_metrics.py
      - name: Save verified changes
        run: |
          git add profile-metrics.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public profile counts'
            git push
          fi
